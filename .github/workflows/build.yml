name: Build Cadence

on:
  push:
    branches: ["accord-compose"]
  pull_request:
    branches: ["accord-compose"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
