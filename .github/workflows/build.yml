name: Build Cadence

on:
  push:
    branches: ["accord-compose"]
  pull_request:
    branches: ["accord-compose"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
