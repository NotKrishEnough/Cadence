[package]
name = "cadence"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06", "image-default-formats"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
walkdir = "2.5"
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.android]
package = "com.notkrishenough.cadence"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "Cadence"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
exported = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.service]]
name = ".PlaybackService"
enabled = true
exported = false
foreground_service_type = "mediaPlayback"
